<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/css/output.css" />
  </head>
  <body>
    <div
      class="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-4"
    >
      <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center">ورود یا ثبت‌نام</h1>
        <p class="text-center text-gray-600 text-sm">
          کد تأیید به شماره موبایلی که وارد می‌کنید، ارسال خواهد شد.
        </p>
        <div class="flex items-center border rounded-xl overflow-hidden">
          <div class="flex items-center px-3 bg-gray-100 border-l">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/c/ca/Flag_of_Iran.svg"
              alt="Iran Flag"
              class="w-6 h-4 ml-2"
            />
            <span class="text-gray-700 font-medium">+۹۸</span>
          </div>
          <input
            type="text"
            placeholder="9*********"
            class="w-full px-4 py-2 text-right outline-none"
          />
        </div>
        <label
          class="flex items-center space-x-2 justify-end text-sm text-gray-700"
        >
          <input
            type="checkbox"
            class="form-checkbox rounded border-gray-300 focus:ring-0 ml-2"
          />
          <span>
            با ورود و ثبت‌نام در سایت، با
            <a href="#" class="text-blue-600 font-medium hover:underline"
              >قوانین اتورنت</a
            >
            موافقت می‌کنم.
          </span>
        </label>
        <button
          class="w-full py-2 bg-gray-300 text-white font-semibold rounded-xl cursor-not-allowed"
          disabled
        >
          تایید و ادامه
        </button>
      </div>
    </div>
  </body>
</html>
