<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/css/output.css" />
  </head>
  <body>
    <!-- #region register-->
    <div class="hidden lg:flex mx-auto mt-3 w-[90%] h-[700px] bg-white">
      <div class="flex flex-col w-[70%] h-full">
        <div class="mt-8 mx-auto">
          <img src="./public/image/register/Logo.png" alt="" />
        </div>
        <div class="flex flex-col text-center mx-auto gap-5 mt-[20%]">
          <p class="mb-5 text-[#494949] text-[20px] font-Esbold">
            ورود یا ثبت‌نام
          </p>
          <p class="text-[#494949] text-[14px] font-EsRegular">
            کد تایید به شماره موبایلی که وارد می‌کنید، ارسال خواهد شد.
          </p>
          <div
            class="flex items-center justify-end gap-3 w-[536px] h-[48px] mb-5 p-2 rounded-lg border-search"
          >
            <input
              type="text"
              placeholder="*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;۹"
              class="w-full text-[#9A9A9A] text-[14px] font-EsRegular text-left outline-none"
            />
            <img src="./public/svg/small-line.svg" alt="" />
            <p class="text-[14px] text-[#0C0C0C] font-EsRegular">۹۸+</p>
            <img src="./public/svg/iran.svg" alt="" />
          </div>
          <label
            class="flex items-center space-x-2 text-[15px] font-EsRegular text-[#727272]"
          >
            <input type="checkbox" class="form-checkbox rounded w-4 h-4 ml-2" />
            <span>
              با ورود و ثبت‌نام در سایت، با
              <a href="#" class="text-blue-600 font-medium hover:underline"
                >قوانین اتورنت</a
              >
              موافقت می‌کنم.
            </span>
          </label>
          <p
            class="flex items-center justify-center w-full h-[48px] py-2 bg-[#F3F3F3] rounded-lg text-[#C2C2C2] font-EsMedium"
          >
            تایید و ادامه
          </p>
        </div>
      </div>

      <div class="w-[30%]">
        <img
          class="w-full h-full"
          src="./public/image/register/img-register.png"
          alt=""
        />
      </div>
    </div>
    <!-- #endregion -->
    <!-- #region register-mobile-->
    <div class="lg:hidden  flex flex-col w-[90%] mx-auto">
      <div class="mt-8 mx-auto">
        <a href="index.html" class="block"
          ><img src="./public/image/register/Logo.png" alt=""
        /></a>
      </div>
      <div class="flex flex-col items-center w-full gap-5 mt-[20%]">
        <p class="mb-5 text-[#494949] text-[20px] font-Esbold">
          ورود یا ثبت‌نام
        </p>
        <p class="text-[#494949] text-[14px] font-EsRegular">
          کد تایید به شماره موبایلی که وارد می‌کنید، ارسال خواهد شد.
        </p>
        <div
          class="flex items-center justify-end bg-white gap-3 w-full mb-5 p-2 rounded-lg border-search"
        >
          <input
            type="text"
            placeholder="*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;*&nbsp;۹"
            class="w-full text-[#9A9A9A] text-[14px] font-EsRegular text-left outline-none"
          />
          <img src="./public/svg/small-line.svg" alt="" />
          <p class="text-[14px] text-[#0C0C0C] font-EsRegular">۹۸+</p>
          <img src="./public/svg/iran.svg" alt="" />
        </div>
        <label
          class="flex w-full items-center space-x-2 text-[13px] font-EsRegular text-[#727272]"
        >
          <input type="checkbox" class="form-checkbox rounded w-4 h-4 ml-2" />
          <span>
            با ورود و ثبت‌نام در سایت، با
            <a href="#" class="text-blue-600 font-medium hover:underline"
              >قوانین اتورنت</a
            >
            موافقت می‌کنم.
          </span>
        </label>
        <p
          class="flex items-center justify-center w-full h-[48px] py-2 bg-white rounded-lg text-[#C2C2C2] font-EsMedium"
        >
          تایید و ادامه
        </p>
      </div>
    </div>
    <!-- #endregion -->
  </body>
</html>
