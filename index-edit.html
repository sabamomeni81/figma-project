<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/css/output.css" />
  </head>
  <body>
    <div
      class="max-w-sm mx-auto p-4 bg-white rounded-2xl border border-gray-200 shadow"
    >
      <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">
        برندهای موجود خودرو
      </h2>
      <div class="space-y-3 text-right">
        <label class="flex items-center space-x-reverse space-x-2">
          <input
            type="radio"
            name="carBrand"
            class="form-radio h-5 w-5 text-blue-600"
            checked
          />
          <span class="text-gray-700">اجاره بنز</span>
        </label>
        <label class="flex items-center space-x-reverse space-x-2">
          <input
            type="radio"
            name="carBrand"
            class="form-radio h-5 w-5 text-blue-600"
          />
          <span class="text-gray-700">اجاره بی ام و</span>
        </label>
        <label class="flex items-center space-x-reverse space-x-2">
          <input
            type="radio"
            name="carBrand"
            class="form-radio h-5 w-5 text-blue-600"
          />
          <span class="text-gray-700">اجاره پژو</span>
        </label>
        <label class="flex items-center space-x-reverse space-x-2">
          <input
            type="radio"
            name="carBrand"
            class="form-radio h-5 w-5 text-blue-600"
          />
          <span class="text-gray-700">اجاره پورشه</span>
        </label>
        <label class="flex items-center space-x-reverse space-x-2">
          <input
            type="radio"
            name="carBrand"
            class="form-radio h-5 w-5 text-blue-600"
          />
          <span class="text-gray-700">اجاره کیا</span>
        </label>
        <label class="flex items-center space-x-reverse space-x-2">
          <input
            type="radio"
            name="carBrand"
            class="form-radio h-5 w-5 text-blue-600"
          />
          <span class="text-gray-700">اجاره هیوندای</span>
        </label>
      </div>
    </div>
  </body>
</html>
